# Sır sızıntısı kapısı — Dört Marka Hesap Mimarisi, Dalga 0 (2026-08-25).
#
# İki kanca, iki ayrı soru:
#   detect-private-key  → dosyanın İÇİNDE özel anahtar bloğu var mı (hızlı, desen bazlı)
#   gitleaks            → API anahtarı, token, parola, bağlantı dizesi (geniş kural seti)
#
# Kurulum:  pre-commit install
# Elle koşum:  pre-commit run --all-files
#
# ⚠ `--no-verify` ile atlamak YASAK (CLAUDE.md, Dört Marka bölümü).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
