<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bildirim Şablonları — DadaFit Yönetim</title>
<link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico" />
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="assets/css/fit-shell.css" />
<link rel="stylesheet" href="assets/css/fit-planim.css" />
<link rel="stylesheet" href="assets/css/fit-admin.css" />
<style>
/* SAYFA CSS — yalnız bu ekranın kendi işi. Yeni renk / token üretilmedi.
   Şablon adı bir bağlantıdır: düzenleme ayrı bir sayfada yaşıyor (D/18). */
.bd-ad{color:inherit;text-decoration:none;display:block;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.bd-ad:hover b{color:var(--fit-deep);text-decoration:underline}
.bd-ad:focus-visible{outline:3px solid var(--fit);outline-offset:2px;border-radius:var(--radius-sm)}
</style>
</head>
<body class="adm-body" data-adm="bildirim">

<div id="fitAdminTop"></div>

<main class="adm-main">
  <div class="adm-page">

    <div class="adm-head">
      <div class="h-txt">
        <h1>Bildirim Şablonları</h1>
        <div class="ph-sub">Uygulamanın üyeye yazdığı her metin burada durur. Bir şablonun iki
           yüzü vardır — e-posta ve uygulama içi — ve ikisi aynı olayı anlatır,
           aynı değişkenleri kullanır.</div>
      </div>
      <div class="h-acts">
        <a class="btn btn-ghost" href="bildirimler-v1.html" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> Üye yüzünü gör</a>
        <a class="btn btn-primary" href="admin-bildirim-form-v1.html"><i class="fa-solid fa-plus"></i> Yeni şablon</a>
      </div>
    </div>

    <div id="bdKaynak"></div>

    <div class="adm-kpi" id="bdKpi"></div>

    <!-- ============ ŞABLON LİSTESİ (K-LİSTE) ============
         🔴 R19'DA DEĞİŞEN: gömülü `#bdF` düzenleme formu SÖKÜLDÜ ve ayrı
         bir sayfaya taşındı (`admin-bildirim-form-v1.html`). D/18'in
         ölçtüğü eksik "şablon EKLENEMİYOR"du; gömülü form yalnız var
         olan bir kaydı düzenleyebiliyordu, çünkü kendi başlığı bir
         seçim kutusuydu — boş bir seçim yeni kayıt açamaz. -->
    <div class="adm-card" id="bdListe">
      <div class="filter-bar">
        <div class="fb-search">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <label class="sr-only" for="bdAra">Şablon ara</label>
          <input type="search" id="bdAra" placeholder="Şablon, tetikleyici ya da konu ara" />
        </div>
        <div class="fb-sel">
          <label class="sr-only" for="bdKanalSuz">Kanala göre süz</label>
          <select id="bdKanalSuz">
            <option value="">Tüm kanallar</option>
            <option value="ikisi">E-posta + uygulama</option>
            <option value="eposta">Yalnız e-posta</option>
            <option value="uygulama">Yalnız uygulama içi</option>
          </select>
        </div>
      </div>

      <div class="c-body flush">
        <div class="adm-tw">
          <table class="adm-table" id="bdTablo">
            <thead>
              <tr><th>Şablon</th><th>Tetikleyici</th><th>Kanal</th>
                  <th class="num">Değişken</th><th>Durum</th><th class="act">İşlem</th></tr>
            </thead>
            <tbody id="bdGovde"></tbody>
          </table>
        </div>
      </div>
      <div class="adm-pager">
        <div class="p-info"><b id="bdSay">0</b> şablon · tümü tek sayfada</div>
        <div class="p-btns">
          <button class="adm-pg" type="button" disabled aria-label="Önceki sayfa"><i class="fa-solid fa-chevron-left"></i></button>
          <button class="adm-pg is-on" type="button" aria-current="page">1</button>
          <button class="adm-pg" type="button" disabled aria-label="Sonraki sayfa"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>
    </div>

    <!-- ============ GÖNDERİM KAYDI — gerçekten boş ============ -->
    <div class="adm-card" id="bdGonderim">
      <div class="c-head">
        <h3><i class="fa-solid fa-paper-plane"></i> Gönderim kaydı</h3>
      </div>
      <div class="c-body" id="bdGonderimGovde"></div>
    </div>

  </div>
</main>

<script src="assets/js/fit-shell.js" data-adm-yalniz-filtre="1"></script>
<script src="assets/js/fit-admin-bildirim-veri.js"></script>
<script src="assets/js/fit-admin.js"></script>
<script>
/* =====================================================================
   ADMIN · BİLDİRİM ŞABLONLARI   (R19)   — K-LİSTE
   ---------------------------------------------------------------------
   🔴 R19'DA DEĞİŞEN ÜÇ ŞEY (D/18):
     1. "Yeni şablon" düğmesi geldi — şablon artık EKLENEBİLİYOR.
     2. Gömülü düzenleme formu söküldü; düzenleme kendi sayfasında
        (`admin-bildirim-form-v1.html?sablon=<anahtar>`).
     3. Satırda SİLME var ve kabuğun yıkıcı onay modalını açıyor
        (`data-yikici`); native `confirm()` bu depoda yasak.

   VERİ TEK KAYNAKTAN: `assets/js/fit-admin-bildirim-veri.js` — form
   ekranı da aynı dosyayı okur.

   🔴 "DEĞİŞKEN" KOLONU İLAN DEĞİL SAYIMDIR: şablonun dört metninde
   gerçekten geçen `{{…}}` kalıpları sayılır. Kaydın kendi `dg` ilanıyla
   ayrıştığında kolon bunu ROZETLE söyler — ölçüldü, bir şablonda gerçekten
   ayrışıyor.

   GÖNDERİM KAYDI GERÇEKTEN BOŞ ve öyle gösteriliyor: bu prototipte sunucu
   yok, hiçbir bildirim gönderilmedi.
   ===================================================================== */
(function () {
  'use strict';
  var A = window.FIT_ADMIN, B = window.FIT_ADMIN_BILDIRIM;
  if (!A) return;
  var esc = A.esc, n = A.n;

  var govde = document.getElementById('bdGovde');

  document.getElementById('bdKaynak').innerHTML = A.kaynak('ornek',
    '<b>Şablon metinleri örnek.</b> Bu depoda bildirim metni tutan bir modül yok — ' +
    'şablonlar <code>fit-admin-bildirim-veri.js</code>e örnek olarak yazıldı ve düzenleme ' +
    'formu da aynı dosyayı okur. <b>Tetikleyiciler gerçek:</b> her biri ' +
    '<code>fit-rozet.js</code> · <code>fit-challenge.js</code> · <code>fit-su.js</code> gibi ' +
    'çalışan bir motorun olayına karşılık geliyor. <b>Değişken sayısı sayımdır</b>, ilan değil: ' +
    'şablonun kendi metninden okunuyor. <b>Yazma yüzeyi maket:</b> ekleme, düzenleme ve silme ' +
    'doğrulanır ama kayıt gitmez.');

  if (!B) {
    govde.innerHTML = '<tr><td colspan="6">' +
      A.bos('fa-bell-slash', 'Şablon verisi yüklenmedi',
            'Kayıtlar assets/js/fit-admin-bildirim-veri.js dosyasından okunur; bu sayfada yüklenemedi.') +
      '</td></tr>';
    return;
  }

  var SABLONLAR = B.SABLONLAR;

  /* ---------- KPI ----------
     Dört sayının dördü de SABLONLAR dizisinden gerçekten sayılıyor. */
  var aktif = SABLONLAR.filter(function (s) { return s.durum === 'aktif'; }).length;
  var epostali = SABLONLAR.filter(function (s) { return s.kanal !== 'uygulama'; }).length;
  var uygulamali = SABLONLAR.filter(function (s) { return s.kanal !== 'eposta'; }).length;
  var ayrisan = SABLONLAR.filter(function (s) {
    var sayilan = B.degiskenleriSay(s);
    return (s.dg || []).filter(function (d) { return sayilan.indexOf(d) < 0; }).length > 0;
  }).length;

  document.getElementById('bdKpi').innerHTML =
    '<div class="k"><span class="ico"><i class="fa-solid fa-bell"></i></span><div>' +
      '<b>' + n(SABLONLAR.length) + '</b><span>Şablon</span>' +
      '<span class="kpi-delta flat"><i class="fa-solid fa-check" aria-hidden="true"></i> ' + n(aktif) +
      ' tanesi aktif; kapalı şablonun metni silinmez, yalnız gönderilmez.</span></div></div>' +
    '<div class="k"><span class="ico"><i class="fa-solid fa-envelope"></i></span><div>' +
      '<b>' + n(epostali) + '</b><span>E-posta metni</span>' +
      '<span class="kpi-delta flat"><i class="fa-solid fa-minus" aria-hidden="true"></i> Konu ve gövde ayrı alanlardır; konu 90 karakterde kesilir.</span></div></div>' +
    '<div class="k"><span class="ico"><i class="fa-solid fa-mobile-screen"></i></span><div>' +
      '<b>' + n(uygulamali) + '</b><span>Uygulama içi metin</span>' +
      '<span class="kpi-delta flat"><i class="fa-solid fa-minus" aria-hidden="true"></i> Listede iki satır görünür; her biri bir sayfaya götürür.</span></div></div>' +
    '<div class="k"><span class="ico"><i class="fa-solid fa-code"></i></span><div>' +
      '<b>' + n(Object.keys(B.DEGISKEN).length) + '</b><span>Değişken sözlüğü</span>' +
      '<span class="kpi-delta ' + (ayrisan ? 'down' : 'flat') + '"><i class="fa-solid ' +
      (ayrisan ? 'fa-triangle-exclamation' : 'fa-minus') + '" aria-hidden="true"></i> ' +
      (ayrisan ? n(ayrisan) + ' şablonda ilan edilen değişken metinde kullanılmıyor.'
               : 'Her şablonun ilanı metniyle örtüşüyor.') + '</span></div></div>';

  /* ---------- liste ---------- */
  govde.innerHTML = SABLONLAR.map(function (s) {
    var sayilan = B.degiskenleriSay(s);
    var fazlaIlan = (s.dg || []).filter(function (d) { return sayilan.indexOf(d) < 0; });
    var d = s.durum === 'aktif' ? A.rozet('ok', 'Aktif', 'fa-circle-check')
                                : A.rozet('off', 'Kapalı', 'fa-circle-minus');
    var duzenle = 'admin-bildirim-form-v1.html?sablon=' + encodeURIComponent(s.key);
    return '<tr data-key="' + esc(s.key) + '" data-kanal="' + esc(s.kanal) + '">' +
      '<td><a class="bd-ad" href="' + esc(duzenle) + '"><b>' + esc(s.ad) + '</b>' +
        '<small>' + esc(s.konu) + '</small></a></td>' +
      '<td><code>' + esc(s.tetik) + '</code></td>' +
      '<td><i class="' + B.KANAL_IKO[s.kanal] + '" aria-hidden="true"></i> ' + esc(B.KANAL_AD[s.kanal]) + '</td>' +
      '<td class="num">' + sayilan.length +
        (fazlaIlan.length ? ' ' + A.rozet('wait', fazlaIlan.length + ' ilan fazla', 'fa-triangle-exclamation') : '') + '</td>' +
      '<td>' + d + '</td>' +
      '<td class="act">' +
        '<a class="adm-ico-btn" href="' + esc(duzenle) + '" aria-label="' + esc(s.ad) + ' şablonunu düzenle">' +
          '<i class="fa-solid fa-pen"></i></a> ' +
        '<button class="adm-ico-btn" type="button" data-sil="' + esc(s.key) + '" ' +
          'data-yikici="' + esc(s.ad) + '" data-fiil="sil" ' +
          'aria-label="' + esc(s.ad) + ' şablonunu sil"><i class="fa-solid fa-trash-can"></i></button>' +
      '</td>' +
    '</tr>';
  }).join('');
  document.getElementById('bdSay').textContent = SABLONLAR.length;
  A.aramaKur(document.getElementById('bdAra'), document.getElementById('bdTablo'), document.getElementById('bdSay'));

  /* ---------- kanal süzgeci ----------
     Arama ile birlikte çalışır: arama satırı gizlemişse süzgeç onu geri
     açmaz, iki koşul da sağlanmalı. */
  var kanalSec = document.getElementById('bdKanalSuz');
  kanalSec.addEventListener('change', function () {
    var v = kanalSec.value;
    var say = 0;
    govde.querySelectorAll('tr[data-key]').forEach(function (tr) {
      var ok = !v || tr.getAttribute('data-kanal') === v;
      tr.hidden = !ok; if (ok) say++;
    });
    document.getElementById('bdSay').textContent = say;
    /* Arama kutusu da açıksa onun süzmesi yeniden uygulanır. */
    var ara = document.getElementById('bdAra');
    if (ara.value) ara.dispatchEvent(new Event('input'));
  });

  /* ---------- silme: kabuğun yıkıcı onay modalı ----------
     `data-yikici` delegesi onayı KENDİLİĞİNDEN açar; buraya düşen tıklama
     onaydan SONRAKİ tıklamadır. Sunucu yok, bu yüzden satır gerçekten
     silinmez ve ekran bunu söyler. */
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-sil]');
    if (!b) return;
    var s = B.bul(b.getAttribute('data-sil'));
    A.toast('“' + (s ? s.ad : 'Şablon') + '” SİLİNMEDİ — bu prototipte sunucu yok.',
            { tip:'danger', ms:3200 });
  });

  /* ---------- gönderim kaydı: gerçekten boş ---------- */
  document.getElementById('bdGonderimGovde').innerHTML = A.bos(
    'fa-paper-plane',
    'Henüz bildirim gönderilmedi',
    'Bu prototipte sunucu yok, bu yüzden hiçbir şablon tetiklenmedi. Gönderim ' +
    'motoru bağlandığında kim, ne zaman ve hangi şablonla bildirim aldı burada listelenir.',
    '<a class="btn btn-ghost" href="bildirimler-v1.html" target="_blank" rel="noopener">' +
    '<i class="fa-solid fa-arrow-up-right-from-square"></i> Üyenin bildirim listesini gör</a>');
})();
</script>
</body>
</html>
