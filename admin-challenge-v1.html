<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Challenge'lar — DadaFit Yönetim</title>
<link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico" />
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="assets/css/fit-shell.css" />
<link rel="stylesheet" href="assets/css/fit-planim.css" />
<link rel="stylesheet" href="assets/css/fit-admin.css" />
<style>
/* SAYFA CSS — yalnız bu ekranın kendi işi. Kalıbın hiçbir parçası burada
   tanımlanmaz; liste · süzgeç · tablo · sayfalama fit-admin.css'te. */
.chf-alan{display:none}
.chf-alan.is-on{display:block}
/* Uydurulmuş inline metin stili yerine — kabukta karşılığı olmayan tek
   kalem: alışkanlık tipinin açıklama paragrafı. */
.chf-desc{font-size:13.5px;color:var(--slate-2);font-weight:500;line-height:1.6;margin:0}
</style>
</head>
<body class="adm-body" data-adm="challenge">

<div id="fitAdminTop"></div>

<main class="adm-main">
  <div class="adm-page">

    <div class="adm-head">
      <div class="h-txt">
        <h1>Challenge'lar</h1>
        <div class="ph-sub">Üç tip: süreli hedef, egzersiz serisi ve alışkanlık. Tip seçimi hedef
           alanlarını değiştirir — üç ayrı form değil, tek form.</div>
      </div>
      <div class="h-acts">
        <a class="btn btn-primary" href="admin-challenge-form-v1.html"><i class="fa-solid fa-plus"></i> Yeni challenge</a>
      </div>
    </div>

    <div id="chKaynak"></div>

    <!-- ============ LİSTE (K1) ============ -->
    <div class="adm-card" id="chListe">
      <div class="c-head">
        <h3><i class="fa-solid fa-trophy"></i> Katalog</h3>
      </div>

      <!-- Filtre şeridi: kartın ilk satırı, arama solda. Süzgeç kabuğun
           ORTAK bileşeni — sayfa yalnız .fgroup yazar, açılır menüyü ve
           aktif çip şeridini kabuk kurar. -->
      <div class="filter-bar">
        <div class="fb-search">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <label class="sr-only" for="chAra">Challenge ara</label>
          <input type="search" id="chAra" placeholder="Ad ya da slug ara" />
        </div>
        <div class="fb-sel">
          <div class="ff" id="chSuzgec" data-ff></div>
        </div>
      </div>

      <div class="c-body flush">
        <div class="adm-tw">
          <table class="adm-table" id="chTablo">
            <thead>
              <tr>
                <th>Challenge</th><th>Tip</th><th class="num">Süre</th>
                <th>Hedef</th><th class="num">Ödül</th><th>Durum</th><th class="act">İşlem</th>
              </tr>
            </thead>
            <tbody id="chGovde"></tbody>
          </table>
        </div>
      </div>

      <div class="adm-pager">
        <div class="p-info"><b id="chSay">0</b> challenge · tümü tek sayfada</div>
        <div class="p-btns">
          <button class="adm-pg" type="button" disabled aria-label="Önceki sayfa"><i class="fa-solid fa-chevron-left"></i></button>
          <button class="adm-pg is-on" type="button" aria-current="page">1</button>
          <button class="adm-pg" type="button" disabled aria-label="Sonraki sayfa"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>
    </div>

    <!-- 🔴 GÖMÜLÜ FORM SÖKÜLDÜ (R19). Yerine `admin-challenge-form-v1.html`.
         Gerekçe ölçüldü (`docs/gastro-olcum/fit-yonetilmeyenler.md` D/4): buradaki
         gömülü kart 10 alan taşıyordu ve katalogun `gorsel` · `donem` · `uzunOzet`
         · `baslik` · `gunlukSure` · ödül rozeti alanlarını hiç görmüyordu. Ayrı form
         sayfası Gastro'nun kanonu (create ve edit AYNI dosya, `form.blade.php`),
         ve iki yazma yüzeyi bırakmak bu depoda üç kez temizlenen "aynı soruya iki
         cevap" kusuru olurdu. -->

  </div>
</main>

<script src="assets/js/fit-shell.js" data-adm-yalniz-filtre="1"></script>
<script src="assets/js/fit-challenge.js"></script>
<script src="assets/js/fit-admin.js"></script>
<script>
/* =====================================================================
   ADMIN · CHALLENGE'LAR   (R16/2)   — K1 liste + K4 form referansı
   ---------------------------------------------------------------------
   Bu ekran kalıbın referansıdır; kalan liste ekranları bunu kopyalar.

   VERİ GERÇEK. Katalog `fit-challenge.js`ten okunuyor — ikinci bir kopya
   tutulmuyor. Şartname "challenge'ı admin oluşturur" diyor; bu ekran o
   yazma ucunun YÜZEYİ, arkası henüz yok ve bunu dürüstçe söylüyor.

   FORM TEK, ALANLAR TİPE GÖRE. Motorun `TIP` tablosu üç tipin ne ölçtüğünü
   zaten tanımlıyor: `sureli` → metrik + değer, `seri` → adım listesi,
   `aliskanlik` → gün. Üç ayrı form yazmak, o tabloyu dördüncü kez
   tekrarlamak olurdu.
   ===================================================================== */
(function () {
  'use strict';
  var A = window.FIT_ADMIN, C = window.FIT_CHALLENGE;
  if (!A) return;
  var esc = A.esc, n = A.n;

  document.getElementById('chKaynak').innerHTML = A.kaynak('canli',
    '<b>Liste gerçek.</b> Katalog <code>fit-challenge.js</code>ten okunuyor — ' +
    'sitedeki üç challenge sayfası da aynı diziden besleniyor, burada ikinci bir ' +
    'kopya yok. <b>Yazma yüzeyi maket:</b> form doğrulanır ama kayıt gitmez, ' +
    'bu prototipte sunucu yok. Panel gerçek yazmayı getirdiğinde bu şerit kalkar.');

  if (!C) {
    document.getElementById('chGovde').innerHTML = '<tr><td colspan="7">' +
      A.bos('fa-trophy', 'Challenge motoru yüklenmedi',
            'Katalog fit-challenge.js dosyasından okunur; bu sayfada yüklenemedi.',
            '<a class="pe-tag" href="challenge-merkezi-v1.html" target="_blank" rel="noopener">' +
            '<i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i> ' +
            'Üye tarafındaki challenge merkezini aç</a>') + '</td></tr>';
    return;
  }

  /* ---------- süzgeç: katalogdan doğar (challenge-merkezi ile aynı desen) ---------- */
  function suzgecKur(){
    var kok = document.getElementById('chSuzgec');
    var tipler = [], durumlar = [];
    C.KATALOG.forEach(function (k) {
      if (tipler.indexOf(k.tip) < 0) tipler.push(k.tip);
      if (durumlar.indexOf(k.durum) < 0) durumlar.push(k.durum);
    });
    var DURUM_AD = { aktif:'Aktif', yaklasan:'Yaklaşan' };
    var DURUM_IKO = { aktif:'fa-solid fa-play', yaklasan:'fa-regular fa-clock' };
    kok.innerHTML =
      '<div class="fgroup" data-group="tip" role="group" aria-label="Tip filtresi">' +
        '<span class="lbl">Tip</span><button class="df-fchip on" type="button" data-val="all">Tümü</button>' +
        tipler.map(function (t) {
          return '<button class="df-fchip" type="button" data-val="' + esc(t) + '">' +
                 '<i class="' + C.TIP[t].ikon + '"></i> ' + esc(C.TIP[t].etiket) + '</button>';
        }).join('') + '</div>' +
      '<div class="fgroup" data-group="durum" role="group" aria-label="Durum filtresi">' +
        '<span class="lbl">Durum</span><button class="df-fchip on" type="button" data-val="all">Tümü</button>' +
        durumlar.map(function (d) {
          return '<button class="df-fchip" type="button" data-val="' + esc(d) + '">' +
                 '<i class="' + DURUM_IKO[d] + '"></i> ' + esc(DURUM_AD[d] || d) + '</button>';
        }).join('') + '</div>';
    if (window.FIT_SHELL && FIT_SHELL.filtreKur) FIT_SHELL.filtreKur(kok);

    var sec = { tip:new Set(), durum:new Set() };
    kok.querySelectorAll('.fgroup[data-group]').forEach(function (g) {
      var grup = g.getAttribute('data-group');
      g.querySelectorAll('.df-fchip').forEach(function (b) {
        b.addEventListener('click', function () {
          var v = b.getAttribute('data-val');
          if (v === 'all') { sec[grup].clear(); g.querySelectorAll('.df-fchip').forEach(function (x) { x.classList.toggle('on', x === b); }); }
          else {
            var ac = !sec[grup].has(v);
            if (ac) sec[grup].add(v); else sec[grup].delete(v);
            b.classList.toggle('on', ac);
            var all = g.querySelector('.df-fchip[data-val="all"]');
            if (all) all.classList.toggle('on', sec[grup].size === 0);
          }
          suz(sec);
        });
      });
    });
  }

  function suz(sec){
    var say = 0;
    document.querySelectorAll('#chGovde tr[data-slug]').forEach(function (tr) {
      var ok = (!sec.tip.size   || sec.tip.has(tr.getAttribute('data-tip'))) &&
               (!sec.durum.size || sec.durum.has(tr.getAttribute('data-durum')));
      tr.hidden = !ok; if (ok) say++;
    });
    document.getElementById('chSay').textContent = say;
  }

  /* ---------- liste ---------- */
  function listeBas(){
    document.getElementById('chGovde').innerHTML = C.KATALOG.map(function (k) {
      var t = C.TIP[k.tip];
      var hedef = k.tip === 'sureli' ? n(k.hedef.deger) + ' ' + esc(k.hedef.ad)
                : k.tip === 'seri'   ? k.adimlar.length + ' adım'
                : k.gun + ' gün işaretle';
      var d = k.durum === 'aktif' ? A.rozet('ok', 'Aktif', 'fa-play')
                                  : A.rozet('wait', 'Yaklaşan', 'fa-clock');
      return '<tr data-slug="' + esc(k.slug) + '" data-tip="' + esc(k.tip) + '" data-durum="' + esc(k.durum) + '">' +
        '<td><b>' + esc(k.ad) + '</b><small>' + esc(k.slug) + '</small></td>' +
        '<td><i class="' + t.ikon + '" aria-hidden="true"></i> ' + esc(t.etiket) + '</td>' +
        '<td class="num">' + k.gun + ' gün</td>' +
        '<td>' + hedef + '</td>' +
        '<td class="num">+' + k.odul.puan + '</td>' +
        '<td>' + d + '</td>' +
        '<td class="act">' +
          '<a class="adm-ico-btn" href="challenge-v1.html?slug=' + esc(k.slug) + '" target="_blank" rel="noopener" aria-label="Sitede gör"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>' +
          '<button class="adm-ico-btn" type="button" data-duzenle="' + esc(k.slug) + '" aria-label="Düzenle"><i class="fa-solid fa-pen"></i></button>' +
        '</td></tr>';
    }).join('');
    document.getElementById('chSay').textContent = C.KATALOG.length;
    A.aramaKur(document.getElementById('chAra'), document.getElementById('chTablo'), document.getElementById('chSay'));
  }

  /* ---------- form: AYRI SAYFA ----------
     R19'da gömülü form kartı söküldü; künye + sunum + ödül + SEO tek yerde,
     `admin-challenge-form-v1.html`de. Liste yalnız oraya yönlendirir. */
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-duzenle]');
    if (b) location.href = 'admin-challenge-form-v1.html?c=' + encodeURIComponent(b.getAttribute('data-duzenle'));
  });

  suzgecKur();
  listeBas();

  /* ---------------------------------------------------------------
     KAYIT SAYACI — Gastro kanonu. ÖLÇÜLDÜ: yedi liste ekranının
     yedisinde de sayı `.ph-sub`ın SONUNDA, `· <strong>N</strong> birim`
     şeklinde duruyor (tarifler/index.blade.php:51 · sozluk:45 ·
     sayfalar:47 · malzemeler:57 · puf-noktalari:44 · mutfaga-giris:94 ·
     video-serileri:33). Sayı ELLE YAZILMAZ — basılan satırdan okunur.
     --------------------------------------------------------------- */
  (function phSay(){
    var alt = document.querySelector('.adm-head .ph-sub');
    var say = document.getElementById('chSay');
    if (!alt || !say) return;
    alt.insertAdjacentHTML('beforeend', ' · <strong>' + say.textContent + '</strong> challenge');
  })();
})();
</script>
</body>
</html>
