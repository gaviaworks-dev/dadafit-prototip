<!DOCTYPE html>

<head>
<meta charset="utf-8" />

      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="

<style>
/* SAYFA CSS — yalnız bu ekranın kendi işi.
   Kuyruk satırı kabuğun `.set-row` kitidir (fit-shell.css:1431), sekme
   şeridi `.fit-tabs`, boş durum `.fpx-bos`. Burada üç şey var, üçü de
   yalnız YERLEŞİM — yeni renk, yeni ölçü, yeni token yok. */

/* Sekme şeridi kart başlığında; dar ekranda tam genişliğe iner. */
.dk-tabwrap{padding:14px 20px;border-bottom:1px solid var(--line)}
@media (max-width:640px){ .dk-tabwrap{padding:14px} }

/* 🔴 KİMLİK HÜCRESİ — kuyruk kartının ölçülmüş eksiği (kuyruk kalemi 10).
   Panelin öteki üç operasyon ekranı (üyeler · antrenörler · log) "bu satır
   kimin" sorusuna kabuğun `.u-cell`iyle cevap veriyordu; destek kuyruğu
   üyenin adını meta satırının ORTASINDA, konu ve tarihin arasında düz metin
   olarak taşıyordu. Kimlik burada bir DETAY değil, satırın kendisi.
   Kart tabloya ÇEVRİLMEDİ: `.set-row` korundu, aralarına kabuğun kendi
   kimlik hücresi girdi. Görünüm `.u-cell`/`.u-ava`/`.u-info` üçlüsünden
   (fit-admin.css §19); burada yalnız hücrenin kart içindeki genişliği var. */
.dk-kim{flex:none;width:210px;min-width:0}
/* ⚠ ÖLÇÜLDÜ: `.u-name`/`.u-email` kabukta blok DEĞİL; geniş bir tablo
   hücresinde bu görünmüyor ama dar bir kart hücresinde ad ve e-posta aynı
   satıra binip yan kolonun üstüne taşıyordu (1440'ta ekran görüntüsüyle
   yakalandı). Kabuğa dokunmak yerine iki satır burada bloklandı. */
.dk-kim .u-name,.dk-kim .u-email{display:block}
/* ⚠ ÖLÇÜLDÜ (390 ve 768, ekran görüntüsüyle): kabuk `.set-row`ı yalnız
   640 altında sarıyor ve orada bile `.sr-txt` `flex:1` kaldığı için,
   yanındaki geniş atama kutusu talebin BAŞLIĞINI ~60px'lik bir sütuna
   sıkıştırıyordu — başlık harf harf alt alta iniyordu. Kimlik hücresi
   eklenince sıkışma 900'e kadar çıktı. Bu yüzden dar ekranda üç parça da
   kendi satırına iniyor: kimlik → başlık → atama. Kart bozulmuyor, yalnız
   sırası dikeye dönüyor. */
@media (max-width:900px){
  .set-row{flex-wrap:wrap;gap:10px 14px}
  .dk-kim{flex:1 1 100%;width:auto;order:-1}
  .set-row .sr-txt{flex:1 1 100%}
}

/* Satır içi atama: kabuğun dar `.set-row .fk-select` kuralını kullanır,
   yalnız etiketiyle birlikte dikey hizalanır. */
.dk-ata{display:flex;align-items:center;gap:9px}
.dk-ata .lbl{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
@media (max-width:640px){ .dk-ata{width:100%} .dk-ata .fk-select{width:100%} }

/* Satır altındaki dürüstlük notu — uygulanmayan bir eylemden sonra belirir.
   🔴 ÖZGÜLLÜK ÖLÇÜLDÜ: kabuğun `.set-row .sr-txt span{display:block}` kuralı
   (0,2,1) `.dk-not.is-on{display:flex}`i (0,2,0) yeniyordu; not boş bir blok
   olarak açılıp yalnız ikonunu gösteriyordu. Kabuğa dokunmak yerine seçici
   yükseltildi (0,3,0) — kabuk sözleşmesi bozulmaz. */
.set-row .sr-txt .dk-not{display:none;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--hs-warn);margin-top:7px}
.set-row .sr-txt .dk-not.is-on{display:flex}
</style>
</head>
<body class="adm-body" data-adm="destek">

<div id="fitAdminTop"></div>

<main class="adm-main">
  <div class="adm-page">

    <div class="adm-head">
      <div class="h-txt">
        <h1>Destek Talepleri</h1>
        <div class="ph-sub">Dört durum, tek kuyruk. <b>Açık</b> talep ekipten yanıt bekler;
           <b>yanıt bekleyen</b> talepte top üyededir. <b>Çözülen</b> talep
           kapanışa hazırdır, <b>kapatılan</b> talebe yeni yanıt yazılmaz.</div>
      </div>
      <!-- Destek iki yüzeyden oluşur: TALEP (bu ekran) ve S.S.S. Bir talebin
           yanıtı çoğu zaman zaten yazılmış bir S.S.S. maddesidir; iki ekran
           bu yüzden birbirine bağlı durur. S.S.S. yönetimi ayrı ekrandır
           çünkü talepler kuyruk, S.S.S. ise katalogtur — biri tükenir, öteki
           büyür. -->
      <div class="h-acts">
        <a class="btn btn-ghost" href="admin-sss-v1.html"><i class="fa-solid fa-circle-question"></i> S.S.S. yönetimi</a>
      </div>
    </div>

    <div id="dkKaynak"></div>

    <!-- ============ KUYRUK (K2) ============ -->
    <div class="adm-card" id="dkKuyruk">
      <div class="filter-bar">
        <div class="fb-search">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <label class="sr-only" for="dkAra">Talep ara</label>
          <input type="search" id="dkAra" placeholder="Numara, üye ya da konu ara" />
        </div>
      </div>
      <div class="dk-tabwrap">
        <!-- 🔴 ŞERİT VE PANELLER STATİK MARKUP'TADIR, JS ile basılmaz.
             ÖLÇÜLEN KUSUR: kabuğun `[data-fit-tabs]` bileşeni sayfayı PARSE
             ANINDA bir kez tarıyor (fit-shell.js, tek geçiş). Sekmeleri
             sonradan JS ile bastığımda bileşen onları hiç görmedi: şerit
             ÖLÜ kaldı — `role` ve `aria-selected` null, panel değişmiyor.
             Ölçüldü: `kapatilan`a tıklandığında görünür panel hâlâ `acik`ti.
             Çözüm kabuğu değiştirmek değil, sözleşmesine uymaktı; şerit ve
             paneller markup'ta durur, JS yalnız sayaç ve içerik doldurur. -->
        <nav class="fit-tabs" data-fit-tabs="dk" aria-label="Talep durumu">
          <button class="fit-tab active" type="button" data-tab="acik"><i class="fa-solid fa-inbox" aria-hidden="true"></i> Açık talep <span class="cnt">—</span></button>
          <button class="fit-tab" type="button" data-tab="yanit-bekleyen"><i class="fa-solid fa-reply" aria-hidden="true"></i> Yanıt bekleyen <span class="cnt">—</span></button>
          <button class="fit-tab" type="button" data-tab="cozulen"><i class="fa-solid fa-circle-check" aria-hidden="true"></i> Çözülen <span class="cnt">—</span></button>
          <button class="fit-tab" type="button" data-tab="kapatilan"><i class="fa-solid fa-lock" aria-hidden="true"></i> Kapatılan <span class="cnt">—</span></button>
        </nav>
      </div>
      <div class="c-body" id="dkPanel">
        <div class="fit-pane" data-pane="acik">
          <div data-basik="acik"></div>
          <div class="set-list" data-liste="acik"></div>
          <div data-bos="acik" hidden></div>
        </div>
        <div class="fit-pane" data-pane="yanit-bekleyen" hidden>
          <div data-basik="yanit-bekleyen"></div>
          <div class="set-list" data-liste="yanit-bekleyen"></div>
          <div data-bos="yanit-bekleyen" hidden></div>
        </div>
        <div class="fit-pane" data-pane="cozulen" hidden>
          <div data-basik="cozulen"></div>
          <div class="set-list" data-liste="cozulen"></div>
          <div data-bos="cozulen" hidden></div>
        </div>
        <div class="fit-pane" data-pane="kapatilan" hidden>
          <div data-basik="kapatilan"></div>
          <div class="set-list" data-liste="kapatilan"></div>
          <div data-bos="kapatilan" hidden></div>
        </div>
      </div>
    </div>

  </div>
</main>

<script>
/* =====================================================================
   ?tab= GERÇEK ROTADIR — ve bu betik kabuktan ÖNCE koşmak ZORUNDA.
   Kabuk sekmeyi parse anında kuruyor ve açılış durumunu MARKUP'tan
   okuyor (`aria-selected="true"` ya da `.active`). Seçim sonradan
   yazılsaydı kabuk çoktan ilk sekmeyi kurmuş olurdu.
   🔴 BEYAZ LİSTE: adresten gelen geçersiz `?tab=` sessizce ilk sekmeye
   düşer (destek-v1.html'in `?durum=` kanonuyla aynı kural).
   ===================================================================== */
(function () {
  var ray = document.querySelector('[data-fit-tabs="dk"]'); if (!ray) return;
  var v = new URLSearchParams(location.search).get('tab'); if (!v) return;
  var hedef = null;
  ray.querySelectorAll('.fit-tab').forEach(function (t) {
    if (t.getAttribute('data-tab') === v) hedef = t;
  });
  if (!hedef) return;
  ray.querySelectorAll('.fit-tab').forEach(function (t) {
    t.classList.remove('active'); t.removeAttribute('aria-selected');
  });
  hedef.classList.add('active'); hedef.setAttribute('aria-selected', 'true');
  document.querySelectorAll('.fit-pane[data-pane]').forEach(function (pn) {
    pn.hidden = (pn.getAttribute('data-pane') !== v);
  });
})();
</script>
<script src="assets/js/fit-shell.js" data-adm-yalniz-filtre="1"></script>
<script src="assets/js/fit-admin-destek-veri.js"></script>
<script src="assets/js/fit-admin.js"></script>
<script>
/* =====================================================================
   ADMIN · DESTEK TALEPLERİ   (R16/2 · R20)   — K2 kuyruk kalıbı
   ---------------------------------------------------------------------
   DÖRT DURUM KANONDUR (CLAUDE.md K8): açık · yanıt bekleyen · çözülen ·
   kapatılan. Beşinci bir durum icat edilmez, "Tümü" bir durum değildir ve
   bu yüzden sekme olarak da yoktur — arama dört sekmenin hepsinde birden
   süzer, "tümü"nün işini o görür.

   DURUMUN YÖNÜ VAR ve kardeş sayfadan birebir alındı
   (`destek-talebi-detay-v1.html` §1.2): `açık` ekipten yanıt bekler,
   `yanıt bekleyen` üyeden. Bu ayrım kuyruk için hayatidir — ikisini tek
   "bekleyen" kovasında toplamak, ekibin sırasını üyenin sırasıyla
   karıştırmak olurdu. Sidebar sayacı (5) bu ikisinin toplamıdır: akışta
   kalan talep.

   VERİ TEK KAYNAKTAN: `fit-admin-destek-veri.js`. Detay + yanıt sayfası
   (`admin-destek-talep-v1.html`, R20) da aynı diziyi okur — kayıt iki
   yerde yaşamaz. R20 ÖNCESİ "Aç" bu sayfada gizli bir kartı açıyordu;
   Gastro'nun ölçülen karşılığı (`admin.destek.talep`) AYRI sayfadır ve
   bu ekran o kalıba çekildi.
   ===================================================================== */
(function () {
  'use strict';
  var A = window.FIT_ADMIN, D = window.FIT_ADMIN_DESTEK;
  if (!A) return;
  var esc = A.esc;

  if (!D) {
    document.getElementById('dkKaynak').innerHTML = A.kaynak('ornek',
      'Destek verisi (<code>fit-admin-destek-veri.js</code>) yüklenemedi.');
    return;
  }
  var DURUM = D.DURUM, TALEP = D.TALEP, TEMSILCI = D.TEMSILCI, gunFarki = D.gunFarki, basHarf = D.basHarf, bul = D.bul;

  document.getElementById('dkKaynak').innerHTML = A.kaynak('ornek',
    '<b>Talep verisi örnektir.</b> On bir talebin numarası, başlığı, konusu, durumu ve ' +
    'son hareket tarihi <code>destek-v1.html</code>in maket listesinden birebir alındı — ' +
    'aynı talep iki yüzeyde farklı görünmesin diye. Üye adı, atanan temsilci ve mesaj ' +
    'sayısı — ve <b>e-posta adresi</b> — bu ekranın kendi örnek alanlarıdır. ' +
    '<b>Yazma yüzeyi maket:</b> atama ' +
    'değişmez — durum ve yanıt <a href="admin-destek-talep-v1.html">talep detayı</a> ekranında.');

  /* ---- sekme sayaçları -------------------------------------------
     Şerit markup'ta; burada yalnız sayaç doldurulur (bkz. markup şerhi). */
  function sayacYaz(id, n){
    var c = document.querySelector('.fit-tab[data-tab="' + id + '"] .cnt');
    if (c) c.textContent = n;
  }

  /* ---- dört panel, her biri KENDİ boş durumunu taşır --------------
     Boş durum sekme başına AYRIDIR: "açık talep yok" ile "kapatılan
     talep yok" aynı cümle değildir; birincisi kuyruğun temiz olması,
     ikincisi hiç kapatılmamış olmasıdır. */
  var BOS = {
    'acik':           ['fa-inbox',        'Açık talep yok',
                       'Ekipten yanıt bekleyen talep kalmadı. Yeni talep geldiğinde bu sekmenin sayacı artar.'],
    'yanit-bekleyen': ['fa-reply',        'Üyeden yanıt beklenen talep yok',
                       'Ekibin yazdığı ve üyenin dönmesini beklediği talep bulunmuyor.'],
    'cozulen':        ['fa-circle-check', 'Çözülen talep yok',
                       'Bu dönemde çözüme bağlanmış talep bulunmuyor. Çözülen talepler kapatılana kadar burada durur.'],
    'kapatilan':      ['fa-lock',         'Kapatılan talep yok',
                       'Kapatılmış talep bulunmuyor. Kapatılan talep listede kalır, yazışması okunur ama yeni yanıt yazılamaz.']
  };

  function satir(t){
    var yas = gunFarki(t.son);
    return '<div class="set-row" data-no="' + esc(t.no) + '" data-ara="' +
        esc((t.no + ' ' + t.uye + ' ' + t.mail + ' ' + t.konu + ' ' + t.baslik).toLocaleLowerCase('tr')) + '">' +
      /* 🔴 DURUM İKONU (`.sr-ico`) SÖKÜLDÜ. Her satırda aynı ikonu basıyordu:
         satırlar zaten durum sekmesine göre ayrılmış paneller içinde duruyor
         ve panelin kendi başlığı da o ikonu taşıyor. Aynı bilgiyi üçüncü kez
         basmak, kimlik hücresinin yanında ikinci bir yuvarlak üretiyordu.
         Durum ikonu duruyor — panel başlığında ve detay künyesinde. */
      /* KİMLİK HÜCRESİ — kabuğun `.u-cell`i, panelin öteki üç operasyon
         ekranıyla (üyeler · antrenörler · log) aynı bileşen. Avatar görseli
         yok — üye fotoğrafı bu depoda hiç tutulmuyor — bu yüzden kitin
         `initials` kipi: uydurulmuş bir yüz basmaktansa baş harf. */
      '<span class="u-cell dk-kim">' +
        '<span class="u-ava initials" aria-hidden="true">' + esc(basHarf(t.uye)) + '</span>' +
        '<span class="u-info">' +
          '<b class="u-name">' + esc(t.uye) + '</b>' +
          '<small class="u-email">' + esc(t.mail) + '</small>' +
        '</span>' +
      '</span>' +
      '<span class="sr-txt">' +
        '<b>' + esc(t.baslik) + '</b>' +
        '<span><i class="fa-solid fa-hashtag" aria-hidden="true"></i> ' + esc(t.no) +
        ' · ' + esc(t.konu) +
        ' · son hareket <time datetime="' + esc(t.son) + '">' + esc(A.tarih(t.son)) + '</time>' +
        ' (' + yas + ' gün önce) · ' + t.mesaj + ' mesaj</span>' +
        '<span class="dk-not" data-not><i class="fa-solid fa-circle-info" aria-hidden="true"></i>' +
          '<span></span></span>' +
      '</span>' +
      '<span class="sr-act">' +
        '<span class="dk-ata"><span class="lbl">Atama</span>' +
          '<label class="sr-only" for="ata-' + esc(t.no) + '">' + esc(t.no) + ' talebinin atanan temsilcisi</label>' +
          '<select class="fk-select" id="ata-' + esc(t.no) + '" data-ata="' + esc(t.no) + '">' +
            TEMSILCI.map(function (k) {
              return '<option' + (k === t.atanan ? ' selected' : '') + '>' + esc(k) + '</option>';
            }).join('') +
          '</select></span>' +
        '<a class="btn btn-ghost" href="admin-destek-talep-v1.html?talep=' + esc(t.no) + '">' +
          '<i class="fa-solid fa-comments" aria-hidden="true"></i> Aç</a>' +
      '</span></div>';
  }

  DURUM.forEach(function (d) {
    var liste = TALEP.filter(function (t) { return t.durum === d.id; });
    var enEski = liste.reduce(function (m, t) { return Math.max(m, gunFarki(t.son)); }, 0);
    sayacYaz(d.id, liste.length);
    document.querySelector('[data-basik="' + d.id + '"]').innerHTML =
      '<div class="fp-row" style="border-bottom:1px solid var(--line);padding-top:0">' +
        '<span class="ico"><i class="fa-solid ' + d.ico + '" aria-hidden="true"></i></span>' +
        '<span class="txt"><b>' + esc(d.ad) + '</b><small>' + esc(d.yon) + '</small></span>' +
        '<span class="end">' + A.rozet(d.rozet, liste.length + ' talep', d.ico) +
          (enEski ? ' <span class="fp-badge off">en eski ' + enEski + ' gün</span>' : '') + '</span></div>';
    document.querySelector('[data-liste="' + d.id + '"]').innerHTML = liste.map(satir).join('');
    document.querySelector('[data-bos="' + d.id + '"]').innerHTML =
      A.bos(BOS[d.id][0], BOS[d.id][1], BOS[d.id][2]);
  });

  /* ---- arama: dört sekmede birden süzer, boş kalan panel kendi
         boş durumunu basar ------------------------------------------ */
  var ara = document.getElementById('dkAra');
  function suz(){
    var q = ara.value.trim().toLocaleLowerCase('tr');
    DURUM.forEach(function (d) {
      var n = 0;
      document.querySelectorAll('[data-liste="' + d.id + '"] .set-row').forEach(function (r) {
        var ok = !q || r.getAttribute('data-ara').indexOf(q) >= 0;
        r.hidden = !ok; if (ok) n++;
      });
      var bos = document.querySelector('[data-bos="' + d.id + '"]');
      if (bos) {
        bos.hidden = (n > 0);
        if (n === 0 && q) {
          bos.innerHTML = A.bos('fa-magnifying-glass', 'Bu aramayla talep bulunamadı',
            '"' + ara.value.trim() + '" için bu durumda talep yok. Arama kutusunu boşalt ya da başka bir sekmeye bak.');
        } else if (n === 0) {
          bos.innerHTML = A.bos(BOS[d.id][0], BOS[d.id][1], BOS[d.id][2]);
        }
      }
      sayacYaz(d.id, n);
    });
  }
  ara.addEventListener('input', suz);

  /* ---- satır içi atama: SESSİZCE UYGULANMIŞ GİBİ YAPMAZ ----------- */
  document.getElementById('dkPanel').addEventListener('change', function (e) {
    var s = e.target.closest && e.target.closest('[data-ata]');
    if (!s) return;
    var t = bul(s.getAttribute('data-ata'));
    var not = s.closest('.set-row').querySelector('[data-not]');
    not.classList.add('is-on');
    not.querySelector('span').textContent =
      'Atama "' + s.value + '" seçildi ama UYGULANMADI — bu prototipte sunucu yok. ' +
      'Kayıttaki atama hâlâ: ' + t.atanan + '.';
  });

  /* ---- detay + yanıt ----------
     R20: "Aç" artık AYRI SAYFAYA gider (admin-destek-talep-v1.html
     ?talep=<no>) — Gastro'nun ölçülen `admin.destek.talep` rotasının aynı
     deseni. Bu ekranda yalnız satır içi atama kalıyor. */

  /* ---- ?tab= yazımı ve geri/ileri tuşu -----------------------------
     Açılış seçimi kabuktan önce koşan betikte (sayfanın altında); burada
     yalnız SEÇİM ADRESE YAZILIR. `sessiz` bayrağı olmasaydı popstate'in
     tetiklediği tıklama yeni bir geçmiş kaydı açar ve geri tuşu kilitlenirdi. */
  var ray = document.querySelector('[data-fit-tabs="dk"]');
  var ILK = DURUM[0].id, sessiz = false;
  ray.addEventListener('click', function (e) {
    var t = e.target.closest && e.target.closest('.fit-tab');
    if (!t || sessiz) return;
    var k = t.getAttribute('data-tab');
    history.pushState({ tab:k }, '',
      location.pathname + (k === ILK ? '' : '?tab=' + encodeURIComponent(k)) + location.hash);
  });
  window.addEventListener('popstate', function () {
    var v = new URLSearchParams(location.search).get('tab') || ILK;
    var t = null;
    ray.querySelectorAll('.fit-tab').forEach(function (x) {
      if (x.getAttribute('data-tab') === v) t = x;
    });
    if (!t) return;
    sessiz = true; t.click(); sessiz = false;
  });

  suz();
})();
</script>
</body>
