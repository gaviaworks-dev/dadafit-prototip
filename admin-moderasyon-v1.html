/* SAYFA CSS — yalnız bu ekranın kendi işi.
   Kuyruk satırı kabuğun `.set-row` kiti, sekme `.fit-tabs`, boş durum
   `.fpx-bos`, rozet `.fp-badge`, eylem düğmesi `.adm-ico-btn` (44×44).
   Burada dört şey var, dördü de yerleşim — yeni renk/ölçü/token yok. */

.md-tabwrap{padding:14px 20px;border-bottom:1px solid var(--line)}
@media (max-width:640px){ .md-tabwrap{padding:14px} }

/* Bildirilen metin ALINTIDIR: gövde yazısından ayrılsın diye kabuğun
   gövde zeminine oturur ve sol kenardan çizgiyle işaretlenir. */
.md-alinti{
  display:block;margin:9px 0 0;padding:11px 14px;background:var(--bg);
  border-left:3px solid var(--line);border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  font-size:13px;font-weight:500;color:var(--slate-2);line-height:1.6;
}
/* Sağlık riski bildiriminde alıntının kenarı tehlike tokenine döner —
   yeni renk değil, kabuğun kendi `--hs-danger-line`ı. */
.set-row.is-saglik .md-alinti{border-left-color:var(--hs-danger-line);background:var(--hs-danger-tint)}

/* 🔴 ÖZGÜLLÜK ÖLÇÜLDÜ (destek ekranıyla aynı kusur): kabuğun
   `.set-row .sr-txt span{display:block}` kuralı (0,2,1) hem dürüstlük notunu
   hem sebep rozetini blok yapıyordu — rozet satır boyu uzuyor, not boş bir
   blok olarak yalnız ikonunu gösteriyordu. Kabuğa dokunulmadı, seçici
   yükseltildi (0,3,0). */
.set-row .sr-txt .fp-badge{display:inline-flex}
.set-row .sr-txt .md-not{display:none;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--hs-warn);margin-top:9px}
.set-row .sr-txt .md-not.is-on{display:flex}

/* Dört eylem düğmesi dar ekranda satırın altına iner (kabuk `.set-row`
   zaten ≤640'ta sarıyor; burada yalnız hizalama söyleniyor). */
.md-acts{display:flex;gap:2px;flex-wrap:wrap}

/* Toplu seçim kutusu. Kutu 18×18 (fit-admin.css'teki `.adm-table` kutusuyla
   aynı ölçü), DOKUNMA HEDEFİ saran etikettir: 44×44. Kutuyu büyütmek yerine
   etiketi hedef yapmak kit §6'daki `.fit-tab` çözümünün aynısıdır. */
.md-sel{display:grid;place-items:center;width:44px;min-height:44px;flex:none;cursor:pointer}
.md-sel input{width:18px;height:18px;accent-color:var(--fit);cursor:pointer}
/* Çubuk panelin içinde yaşıyor, kartın kenarına dayanmıyor. */
.fit-pane .adm-bulk{border-radius:var(--radius-md);border-bottom:0;margin-bottom:12px}

/* UYARI MODALI — R20. ÖNCEKİ HÂLİ (`#mdUyar`) sayfanın altında gizli bir
   kart açıp `scrollIntoView` yapıyordu; Beyar'ın ölçtüğü kusurun aynısı
   (bkz. abonelikler/faturalar). Alan sayısı üç (kişi salt-okunur ·
   şablon · metin) — kitin modal eşiği içinde, bu yüzden AYRI SAYFA değil
   kabuğun `.sa-modal-ov`/`.sa-modal` primitifleri (`admin-taksonomi-v1.html`
   deseninin aynısı). */
.sa-modal.md-modal{width:min(520px,100%);padding:0;max-height:88vh;display:flex;flex-direction:column}
.mdm-head{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
.mdm-head h3{margin:0;font-size:16px;display:flex;align-items:center;gap:9px}
.mdm-head h3 i{color:var(--hs-warn);font-size:14px}
.mdm-x{
  margin-left:auto;width:44px;height:44px;flex:none;border:0;background:none;
  color:var(--muted);font-size:15px;cursor:pointer;border-radius:var(--radius-sm);
}
.mdm-x:hover{color:var(--slate);background:var(--bg)}
.mdm-body{padding:20px 22px;overflow-y:auto}
.mdm-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--line)}
</style>

<script>
/* ?tab= GERÇEK ROTA — kabuktan ÖNCE koşar (destek ekranındaki şerhin aynısı):
   kabuk sekmeyi parse anında kurar ve açılışı markup'tan okur.
   🔴 BEYAZ LİSTE: geçersiz `?tab=` sessizce ilk sekmeye düşer. */
(function () {
  var ray = document.querySelector('[data-fit-tabs="md"]'); if (!ray) return;
  var v = new URLSearchParams(location.search).get('tab'); if (!v) return;
  var hedef = null;
  ray.querySelectorAll('.fit-tab').forEach(function (t) {
    if (t.getAttribute('data-tab') === v) hedef = t;
  });
  if (!hedef) return;
  ray.querySelectorAll('.fit-tab').forEach(function (t) {
    t.classList.remove('active'); t.removeAttribute('aria-selected');
  });
  hedef.classList.add('active'); hedef.setAttribute('aria-selected', 'true');
  document.querySelectorAll('.fit-pane[data-pane]').forEach(function (pn) {
    pn.hidden = (pn.getAttribute('data-pane') !== v);
  });
})();
</script>

<script>
/* =====================================================================
   ADMIN · MODERASYON   (R16/2)   — K2 kuyruk kalıbı
   ---------------------------------------------------------------------
   DESTEK EKRANIYLA AYNI İSKELET. İki kuyruk aynı kalıptır (plan §4/K2):
   dört durum sekmesi · satır kartları · satır içi eylem · sekme başına
   ayrı boş durum. Ayrı bir moderasyon kalıbı icat edilmedi; ayrılan tek
   şey satırın taşıdığı veri ve satırın verdiği karardır.

   🔴 SAĞLIK RİSKİ BU EKRANIN KENDİ EKSENİDİR. DadaFit tıbbi tavsiye
   vermez (`saglik-bilgilendirme-v1.html`); ama üyeler birbirine veriyor.
   "Ağrıya rağmen devam et", "günde 500 kalori yeter" gibi bir yorum spam
   değildir, zarardır — bu yüzden `saglik-riski` sebebi ayrı bir rozet
   taşır, alıntısı tehlike tokeniyle çerçevelenir ve satır kuyruğun
   BAŞINA alınır. Sıralama bir görsel süs değil, karar sırasıdır.

   VERİ ÖRNEK. Bu depoda yorum verisi tutan bir sözleşme modülü yok;
   içerik tipleri (egzersiz · program · challenge yorumu, antrenör
   değerlendirmesi, üye mesajı) mevcut sayfaların gerçek yüzeylerinden
   alındı, metinler örnektir. Sunucu yok: hiçbir karar uygulanmaz.
   ===================================================================== */
(function () {
  'use strict';
  var A = window.FIT_ADMIN;
  if (!A) return;
  var esc = A.esc;

  /* ---- kuyruk durumları: bildirimin ömrü ------------------------- */
  var DURUM = [
    { id:'bekleyen',  ad:'Bekleyen',  ico:'fa-flag',         rozet:'wait',
      yon:'Bildirildi, karar verilmedi. Sağlık riski taşıyanlar listenin başında durur.' },
    { id:'onaylanan', ad:'Onaylanan', ico:'fa-circle-check', rozet:'ok',
      yon:'İçerik kuralları çiğnemiyor; yerinde kaldı ve bildiren üyeye sonuç bildirildi.' },
    { id:'gizlenen',  ad:'Gizlenen',  ico:'fa-eye-slash',    rozet:'off',
      yon:'İçerik herkesten gizlendi ama silinmedi; yazarı görür, itiraz edebilir.' },
    { id:'silinen',   ad:'Silinen',   ico:'fa-trash',        rozet:'stop',
      yon:'İçerik kalıcı olarak kaldırıldı. Yalnız kayıt satırı kalır, metin geri gelmez.' }
  ];
  function durumBul(id){ for (var i=0;i<DURUM.length;i++) if (DURUM[i].id===id) return DURUM[i]; return DURUM[0]; }

  /* ---- sebepler: `agir` olan kuyruğun başına geçer ----------------
     🔴 `sablon` ALANI SEBEBİN KENDİ ÜSTÜNDE DURUR (B2, kuyruk 27).
     Eskiden uyarı modalı sebebi bir üçlü-koşul zincirine sokuyordu
     (`agir ? 'saglik' : reklam ? … : 'spam'`) ve zincirin sonu 'spam'di:
     sözlükte şablonu olmayan HER sebep sessizce "Yinelenen içerik"
     uyarısına düşüyordu. ÖLÇÜLDÜ: altı sebebin ikisi — `yanlis-bilgi`
     ve `belirtilmedi` — bu düşüşü yaşıyordu; üyeye gidecek metin
     "aynı metnin kısa aralıklarla birden çok yere gönderildiğini
     gördük" diyordu. Yanlış şablonla gönderilen uyarı, uyarının
     kendisini yanlış yapar. Eşleşme artık burada, tek yerde: yeni bir
     sebep eklendiğinde şablonu da yanında yazılır, yazılmazsa modal
     boş şablonla açılır ve temsilciyi SEÇMEYE zorlar — sessizce
     yanlış metin basmaz. */
  var SEBEP = {
    'saglik-riski': { ad:'Sağlık riski', ico:'fa-heart-pulse',           rozet:'stop', agir:true,  sablon:'saglik' },
    'yanlis-bilgi': { ad:'Yanlış bilgi', ico:'fa-circle-exclamation',    rozet:'wait', agir:false, sablon:'yanlis-bilgi' },
    'hakaret':      { ad:'Hakaret',      ico:'fa-face-angry',            rozet:'stop', agir:false, sablon:'hakaret' },
    'reklam':       { ad:'Reklam',       ico:'fa-bullhorn',              rozet:'off',  agir:false, sablon:'reklam' },
    'spam':         { ad:'Spam',         ico:'fa-repeat',                rozet:'off',  agir:false, sablon:'spam' },
    /* R20 · Sebepsiz kayıt için GERÇEĞİN ADI. Yorum modülünün bildirim
       akışı sebep sormuyor (kuyruk 30); gelen kaydı rastgele bir sebebe
       (eskiden 'spam') düşürmek yanlış şablonla uyarı üretirdi. Ayrıca
       `SEBEP[null]` dört yerde `.agir` okunuyor — sözlükte karşılığı
       olmayan bir sebep sayfayı çökertirdi.
       `sablon:''` bilerek boştur: sebebi bilinmeyen bir bildirim için
       hazır metin YOKTUR, olanı uydurmak olurdu. */
    'belirtilmedi': { ad:'Sebep belirtilmedi', ico:'fa-circle-question', rozet:'wait', agir:false, sablon:'' }
  };

  var TUR = {
    'egzersiz':  { ad:'Egzersiz yorumu',        ico:'fa-dumbbell' },
    'program':   { ad:'Program yorumu',         ico:'fa-clipboard-list' },
    'challenge': { ad:'Challenge yorumu',       ico:'fa-trophy' },
    'antrenor':  { ad:'Antrenör değerlendirmesi', ico:'fa-user-check' },
    'mesaj':     { ad:'Üye mesajı',             ico:'fa-comment-dots' },
    /* 6. TÜR — Beyar R21: "moderasyon kuyruğuna altıncı tür, kullanıcı
       yorumları eklenecek". ÖLÇÜLDÜ (Playwright, bu tur): kapsam olarak
       verilen üç yüzeyden yalnız BİRİ gerçek — `egzersiz-detay-v1.html` ve
       `program-detay-v1.html`de hiçbir yorum/değerlendirme düğümü yok (grep
       + DOM sayımı 0/0), o yüzden buraya sahte satır EKLENMEDİ. Gerçek olan
       yüzey antrenör profilindeki "Danışan Yorumları" kartlarıdır
       (`antrenor-detay-v1.html` → 3 `.rev-card`; `profil-v1.html` →
       3+3 `.rev-item`, rozet 212/120 toplam değerlendirme sayar).
       `antrenor` türünden FARKI: `antrenor` bir değerlendirmenin antrenörün
       İTİBARINA yönelik ihlalini taşır (bkz. MOD-2026-0404, hakaret);
       `yorum` aynı "Danışan Yorumları" yüzeyinde YAZARIN KENDİ METNİNİN
       ihlal taşıdığı bildirimlerdir (reklam, yanlış bilgi). */
    'yorum':     { ad:'Danışan yorumu',         ico:'fa-comment' }
  };

  /* ---- "Danışan yorumu" verisi — SAVUNMACI OKUMA (R21/A15 sözleşmesi)
     A15 ayrı ajanda `assets/js/fit-yorum-veri.js`i kuruyor; bu dosya o
     modülü YARATMAZ, YÜKLEMEZ (script etiketi eklenmedi — dosya henüz
     yok, eklemek 404/konsol hatası üretirdi). Yalnız `window.FIT_YORUM`
     çalışma anında VARSA okur. A15 bitirip modül başka bir yoldan bu
     sayfaya yüklenince (script etiketi kabuğa ya da bu dosyaya sonradan
     eklenir) ekran KENDİLİĞİNDEN canlıya geçer — ikinci bir tur gerekmez.
     Sözleşme (lead'in verdiği, A15 değişebilir):
       window.FIT_YORUM.hepsi()  → yorum kaydı dizisi
     Alan adları KESİN DEĞİL — bu yüzden her alan birden çok olası adla,
     try/catch içinde, koruma altında okunuyor; sözleşme uyuşmazsa
     (dizi yok/boş/alan adı tutmuyor) sayfa ÇÖKMEZ, örneğe düşer. */
  var ORNEK_YORUM = [
    /* Yüzey gerçek: antrenor-detay-v1.html "Danışan Yorumları" sekmesi
       (bkz. Selin Aksoy · rev-card ×3). Yazar ve içerik uydurma, antrenör
       kimliği sayfadaki gerçek kayıtla eşleşiyor. */
    { id:'MOD-2026-0410', durum:'bekleyen', tur:'yorum', sebep:'reklam',
      yazar:'Buse Kaya', yer:'Antrenör · Selin Aksoy · Danışan Yorumları', bildiren:2, tarih:'2026-08-28',
      metin:'Selin\'in programını burada değil, benim linkimden %30 indirimle alabilirsiniz, yorumlara yazın mesaj atayım.' },
    { id:'MOD-2026-0406', durum:'bekleyen', tur:'yorum', sebep:'yanlis-bilgi',
      yazar:'Onur Ş.', yer:'Antrenör · Selin Aksoy · Danışan Yorumları', bildiren:1, tarih:'2026-08-27',
      metin:'Selin iyi ama haftada tek gün antrenman hiç fayda etmiyor, her gün ağırlık kaldırmazsan boşuna vakit kaybediyorsun.' }
  ];
  function gecerliDurum(v){ for (var i=0;i<DURUM.length;i++) if (DURUM[i].id===v) return true; return false; }
  /* 🔴 R20 · A15'İN GERÇEK SÖZLEŞMESİNE BAĞLANDI.
     İlk yazılışta alan adları TAHMİN edilmişti (`r.bildirildi` · `r.rapor` ·
     `r.bildirenSayisi`) çünkü modül henüz yoktu. Modül gelince ölçüldü ve
     üçü de YOK: `fit-yorum-veri.js` durumu `durum` alanında tutuyor
     (`bekliyor · onayli · reddedildi · sikayetli · gizli · kaldirildi`) ve
     `yazar` düz metin değil NESNE (`{ad,foto,rozet,alt}`). Eski eşleme
     modülü bulsa bile 0 kayıt süzer, `[object Object]` basar ve sessizce
     örneğe düşerdi — bu depoda üç kez temizlenen "çalışan yedek yol kusuru
     görünmez kılar" hatası (docs/lessons.md §34 yan dersi).

     İKİ SÖZLÜK ARASINDAKİ EŞLEME (yorum modülü → moderasyon kuyruğu):
       sikayetli · bekliyor  → bekleyen   (karar verilmedi)
       gizli                 → gizlenen
       reddedildi·kaldirildi → silinen
       onayli                → kuyruğa GİRMEZ (yayında, moderasyon işi değil)

     `canli` bayrağı MODÜLÜN VARLIĞINA bağlı, kayıt sayısına değil: kuyruk
     boşsa bu "şikâyet edilmiş yorum yok" demektir — dürüst bir boş durum,
     örneğe düşme sebebi değil. */
  var YORUM_DURUM = { sikayetli:'bekleyen', bekliyor:'bekleyen', gizli:'gizlenen',
                      reddedildi:'silinen', kaldirildi:'silinen' };
  var YORUM_TUR_AD = { antrenor:'Antrenör', egzersiz:'Egzersiz', program:'Program' };

  function yorumYer(r){
    var ad = YORUM_TUR_AD[r.tur] || 'İçerik';
    var slug = String(r.slug || '').replace(/-/g, ' ');
    return slug ? (ad + ' · ' + slug.charAt(0).toLocaleUpperCase('tr') + slug.slice(1)) : ad;
  }

  function danisanYorumVeri(){
    try {
      if (window.FIT_YORUM && typeof FIT_YORUM.hepsi === 'function') {
        var ham = FIT_YORUM.hepsi();
        if (Array.isArray(ham)) {
          var kuyruk = ham.filter(function (r) { return r && YORUM_DURUM[r.durum]; });
          return { liste: kuyruk.map(function (r) {
            return {
              id: 'MOD-Y-' + r.id,
              durum: YORUM_DURUM[r.durum],
              tur: 'yorum',
              /* Sebep UYDURULMAZ. Bildirim akışı sebep sormuyor (kuyruk 30);
                 sebepsiz kayıt kartta "belirtilmedi" basar, rastgele bir
                 şablona düşürülmez — yanlış şablonla uyarı göndermek
                 uyarının kendisini yanlış yapar. */
              sebep: (r.sebep && SEBEP[r.sebep]) ? r.sebep : 'belirtilmedi',
              yazar: (r.yazar && r.yazar.ad) || 'Üye',
              yer: yorumYer(r),
              bildiren: r.bildiren || 1,
              tarih: (r.tarih || '').slice(0, 10),
              metin: r.metin || ''
            };
          }), canli: true };
        }
      }
    } catch (e) { /* sözleşme uyuşmadı — örneğe düş, sayfa çökmesin */ }
    return { liste: ORNEK_YORUM, canli: false };
  }
  var YORUM_VERI = danisanYorumVeri();

  var BILDIRIM = [
    { id:'MOD-2026-0412', durum:'bekleyen', tur:'challenge', sebep:'saglik-riski',
      yazar:'Kaan Erdem', yer:'30 Günde Hareket Alışkanlığı', bildiren:3, tarih:'2026-08-29',

  /* "Danışan yorumu" satırları burada eklenir — kaynağı yukarıdaki
     `danisanYorumVeri()` belirledi (A15'in modülü ya da örnek). */
  Array.prototype.push.apply(BILDIRIM, YORUM_VERI.liste);

  var BUGUN = new Date('2026-08-30T00:00:00');

  /* İKİ AYRI ŞERİT — Gastro'nun karma kaynaklı ekranlarında zaten olan
     desen (`admin-raporlar-v1.html`de 5 kaynak şeridi ölçüldü, tek örnek

  document.getElementById('mdKaynak').innerHTML =

  /* ---- sekme sayaçları — şerit markup'ta, burada yalnız sayı ------ */

        '<q class="md-alinti">' + esc(b.metin) + '</q>' +
        '<span class="md-not" data-not><i class="fa-solid fa-circle-info" aria-hidden="true"></i><span></span></span>' +

        EYLEM.map(function (e) {

            'title="' + esc(e[2]) + '" aria-label="' + esc(b.id + ' · ' + e[2]) + '">' +

        }).join('') +

  /* Sağlık riski ÖNCE, sonra bildiren sayısı, sonra tarih. */
  function sirala(a, b){
    var fa = SEBEP[a.sebep].agir ? 0 : 1, fb = SEBEP[b.sebep].agir ? 0 : 1;
    if (fa !== fb) return fa - fb;
    if (a.bildiren !== b.bildiren) return b.bildiren - a.bildiren;
    return a.tarih < b.tarih ? 1 : -1;
  }

  /* Başlıktaki sayaç TOPLAMDIR — sekme sayaçları durum başına sayar. */
  document.getElementById('mdBasSay').textContent = BILDIRIM.length;

  DURUM.forEach(function (d) {
    var liste = BILDIRIM.filter(function (b) { return b.durum === d.id; }).sort(sirala);

  /* ---- tür süzgeci: `admin-hareketler-v1.html`teki `.fgroup`/`.df-fchip`

  var TUR_SEC = [];
  function suzgecKur(){
    var kok = document.getElementById('mdSuzgec');
    kok.innerHTML = '<div class="fgroup" data-group="tur" role="group" aria-label="Tür filtresi">' +
      '<span class="lbl">Tür</span>' +

      Object.keys(TUR).map(function (k) {
        var t = TUR[k];
        return '<button class="df-fchip" type="button" data-val="' + esc(k) + '">' +
          '<i class="fa-solid ' + t.ico + '" aria-hidden="true"></i> ' + esc(t.ad) + '</button>';
      }).join('') + '</div>';
    if (window.FIT_SHELL && FIT_SHELL.filtreKur) FIT_SHELL.filtreKur(kok);
    kok.querySelectorAll('.df-fchip').forEach(function (b) {
      b.addEventListener('click', function () {
        var v = b.getAttribute('data-val');
        if (v === 'all') {
          TUR_SEC = [];
          kok.querySelectorAll('.df-fchip').forEach(function (x) { x.classList.toggle('on', x === b); });
        } else {
          var i = TUR_SEC.indexOf(v);
          if (i < 0) TUR_SEC.push(v); else TUR_SEC.splice(i, 1);
          b.classList.toggle('on', i < 0);
          var all = kok.querySelector('.df-fchip[data-val="all"]');
          if (all) all.classList.toggle('on', TUR_SEC.length === 0);
        }
        suz();
        DURUM.forEach(function (d) { secimTazele(d.id); });
      });
    });
  }

  /* ---- arama + tür süzgeci: dört sekmede birden --------------------- */
  var ara = document.getElementById('mdAra');

      var n = 0;
      document.querySelectorAll('[data-liste="' + d.id + '"] .set-row').forEach(function (r) {
        var okAra = !q || r.getAttribute('data-ara').indexOf(q) >= 0;
        var okTur = !TUR_SEC.length || TUR_SEC.indexOf(r.getAttribute('data-tur')) >= 0;
        var ok = okAra && okTur;
        r.hidden = !ok; if (ok) n++;
      });
      var bos = document.querySelector('[data-bos="' + d.id + '"]');
      if (bos) {
        var suzgecAktif = q || TUR_SEC.length;

                  (q ? '"' + ara.value.trim() + '" için b' : 'B') +

  /* ---- toplu seçim: kabuğun `secimKur`u TABLO bekler, bu kuyruk

  function secimTazele(id){

  };
  /* ---------- uyarı MODALI — taksonomi'nin `.sa-modal-ov`/`.sa-modal`
     deseninin aynısı (R20). ---------- */
  var uyarKok = null, uyarTetikleyen = null;

  function uyarKapat(){
    if (!uyarKok) return;
    var ov = uyarKok;
    uyarKok = null;
    ov.classList.remove('open');
    document.removeEventListener('keydown', uyarTus, true);
    setTimeout(function () {
      if (ov.parentNode) ov.parentNode.removeChild(ov);
      if (window.FIT_SHELL && FIT_SHELL.unlockScroll) FIT_SHELL.unlockScroll();
      if (uyarTetikleyen && uyarTetikleyen.focus) uyarTetikleyen.focus();
    }, 180);
  }
  function uyarTus(e){
    if (!uyarKok) return;
    if (e.key === 'Escape') { e.preventDefault(); uyarKapat(); return; }
    if (e.key !== 'Tab') return;
    var od = uyarKok.querySelectorAll('button,input,select,textarea,a[href]');
    if (!od.length) return;
    var liste = Array.prototype.slice.call(od).filter(function (x) { return !x.disabled; });
    var ix = liste.indexOf(document.activeElement);
    e.preventDefault();
    liste[(ix + (e.shiftKey ? -1 : 1) + liste.length) % liste.length].focus();
  }

  function uyarAc(b){
    uyarTetikleyen = document.activeElement;
    var gecmis = BILDIRIM.filter(function (x) { return x.yazar === b.yazar; }).length;
    /* Şablon SEBEBİN kendi alanından okunur (yukarıdaki SEBEP sözlüğü).
       Sözlükte karşılığı olmayan / boş bırakılmış sebepte seçim BOŞ
       açılır: temsilci şablonu elle seçer. Eski üçlü-koşul zinciri
       burada duruyordu ve eşleşmeyen her sebebi 'spam'e düşürüyordu. */
    var ilkSablon = SEBEP[b.sebep].sablon || '';
    if (ilkSablon && !SABLON[ilkSablon]) ilkSablon = '';

    var ov = document.createElement('div');
    ov.className = 'sa-ov sa-modal-ov';
    ov.innerHTML =
      '<div class="sa-modal md-modal" role="dialog" aria-modal="true" aria-label="Kullanıcıyı uyar">' +
        '<div class="mdm-head">' +
          '<h3><i class="fa-solid fa-triangle-exclamation"></i> Kullanıcıyı uyar: ' + esc(b.yazar) + '</h3>' +
          '<button class="mdm-x" type="button" id="mdUyarKapat" aria-label="Kapat">' +
            '<i class="fa-solid fa-xmark" aria-hidden="true"></i></button>' +
        '</div>' +
        '<div class="mdm-body">' +
          '<form id="mdF" novalidate>' +
            '<div class="fk-grid c2">' +
              '<div class="fk-field">' +
                '<label class="fk-label" for="muKisi">Uyarılacak üye</label>' +
                '<input class="fk-input" id="muKisi" readonly aria-readonly="true" value="' + esc(b.yazar) + '" />' +
                '<span class="fk-help"><i class="fa-solid fa-circle-info"></i> Bu üyenin moderasyon kaydında ' +
                  gecmis + ' bildirim var · ilgili bildirim ' + esc(b.id) + '</span>' +
              '</div>' +
              '<div class="fk-field">' +
                '<label class="fk-label" for="muSablon">Uyarı şablonu <span class="req">*</span></label>' +
                '<select class="fk-select" id="muSablon" name="sablon" required>' +
                  /* Boş seçenek YALNIZ eşleşen şablon yokken basılır —
                     eşleşme varken listeye "seç" satırı koymak, doğru
                     seçili olan şablonu kazara kaybettirirdi. */
                  (ilkSablon ? '' : '<option value="" selected>— şablon seç —</option>') +
                  Object.keys(SABLON).map(function (k) {
                    return '<option value="' + k + '"' + (k === ilkSablon ? ' selected' : '') + '>' + esc(SABLON[k][0]) + '</option>';
                  }).join('') +
                '</select>' +
                '<span class="fk-help"><i class="fa-solid fa-circle-info"></i> ' +
                  (ilkSablon
                    ? 'Şablon metni aşağıya düşer; göndermeden önce olayı anlatacak şekilde düzenlenir.'
                    : 'Bildirimde sebep yok, bu yüzden şablon önceden seçilmedi. Olaya uyanı seç — metin aşağıya düşer ve düzenlenir.') +
                '</span>' +
              '</div>' +
            '</div>' +
            '<div class="fk-field">' +
              '<label class="fk-label" for="muMetin">Üyeye gidecek metin <span class="req">*</span>' +
                '<span class="fk-count" id="muSay">0 / 1200</span></label>' +
              '<textarea class="fk-textarea" id="muMetin" name="metin" rows="6" required maxlength="1200"></textarea>' +
            '</div>' +
          '</form>' +
        '</div>' +
        '<div class="mdm-foot">' +
          '<button class="btn btn-ghost" type="button" id="mdUyarVazgec">Vazgeç</button>' +
          '<button class="btn btn-primary" type="button" id="mdUyarGonder"><i class="fa-solid fa-paper-plane"></i> Uyarıyı gönder</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(ov);
    uyarKok = ov;

    if (window.FIT_SHELL && FIT_SHELL.lockScroll) FIT_SHELL.lockScroll();
    requestAnimationFrame(function () {
      ov.classList.add('open');
      var ilk = ov.querySelector('#muSablon');
      if (ilk) ilk.focus();
    });

    var sablonSec = ov.querySelector('#muSablon'), metin = ov.querySelector('#muMetin');
    function sablonUygula(){
      /* Boş seçimde metin BOŞ kalır — `SABLON[''][1]` eskiden TypeError
         atardı ve modal ölü açılırdı. Boş seçim geçerli bir hâldir. */
      var s = SABLON[sablonSec.value];
      metin.value = s ? s[1] : '';
      ov.querySelector('#muSay').textContent = metin.value.length + ' / 1200';
    }
    sablonUygula();
    sablonSec.addEventListener('change', sablonUygula);
    metin.addEventListener('input', function () {
      ov.querySelector('#muSay').textContent = metin.value.length + ' / 1200';
    });

    ov.querySelector('#mdUyarKapat').addEventListener('click', uyarKapat);
    ov.querySelector('#mdUyarVazgec').addEventListener('click', uyarKapat);
    ov.addEventListener('mousedown', function (e) { if (e.target === ov) uyarKapat(); });
    document.addEventListener('keydown', uyarTus, true);

    A.maketKaydet(ov.querySelector('#mdUyarGonder'), 'uyarı', ov.querySelector('#mdF'));
  }

  /* ---- kararlar: SESSİZCE UYGULANMIŞ GİBİ YAPMAZ ------------------- */
  var KARAR_AD = { onayla:'Onayla', gizle:'Gizle', sil:'Sil', uyar:'Uyar' };
  document.getElementById('mdPanel').addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-eylem]');
    if (!b) return;
    var kayit = bul(b.getAttribute('data-hedef'));
    if (b.getAttribute('data-eylem') === 'uyar') { uyarAc(kayit); return; }
    var not = b.closest('.set-row').querySelector('[data-not]');
    not.classList.add('is-on');
    not.querySelector('span').textContent =
      '"' + KARAR_AD[b.getAttribute('data-eylem')] + '" seçildi ama UYGULANMADI — ' +
      'içerik yerinde duruyor, kayıt hâlâ "' + durumBul(kayit.durum).ad + '". Bu prototipte sunucu yok.';
  });

  /* ---- ?tab= yazımı ve geri/ileri tuşu (destek ekranıyla aynı desen) */
  var ray = document.querySelector('[data-fit-tabs="md"]');
  var ILK = DURUM[0].id, sessiz = false;
  ray.addEventListener('click', function (e) {
    var t = e.target.closest && e.target.closest('.fit-tab');
    if (!t || sessiz) return;
    var k = t.getAttribute('data-tab');
    history.pushState({ tab:k }, '',
      location.pathname + (k === ILK ? '' : '?tab=' + encodeURIComponent(k)) + location.hash);
  });
  window.addEventListener('popstate', function () {
    var v = new URLSearchParams(location.search).get('tab') || ILK;
    var t = null;
    ray.querySelectorAll('.fit-tab').forEach(function (x) {
      if (x.getAttribute('data-tab') === v) t = x;
    });
    if (!t) return;
    sessiz = true; t.click(); sessiz = false;
  });

  suz();
  DURUM.forEach(function (d) { secimTazele(d.id); });
})();
</script>
</body>
</html>
