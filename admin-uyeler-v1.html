<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Üyeler ve Yetki — DadaFit Yönetim</title>
<link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico" />
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="assets/css/fit-shell.css" />
<link rel="stylesheet" href="assets/css/fit-planim.css" />
<link rel="stylesheet" href="assets/css/fit-admin.css" />
<style>
/* SAYFA CSS — yalnız bu ekranın kendi işi.
   Liste · süzgeç · tablo · sayfalama · kart · kimlik hücresi kabukta;
   burada yalnız satır adının bağlantı hâli var. Yeni renk üretilmedi. */

/* Satır adı artık bir DÜĞME değil, gerçek bir BAĞLANTI: detay ayrı bir
   sayfada yaşıyor (D/8). Bağlantı olması üç şeyi bedavaya getiriyor —
   yeni sekmede açma, adresi kopyalama ve klavyeyle gezinme. Kimliğin
   GÖRÜNÜMÜ kabuğun `.u-cell`/`.u-ava`/`.u-info` üçlüsü (fit-admin.css §19). */
.uy-ad{min-height:44px;width:100%;color:inherit;text-decoration:none}
.uy-ad:hover .u-name{color:var(--fit-deep);text-decoration:underline}
.uy-ad:focus-visible{outline:3px solid var(--fit);outline-offset:2px;border-radius:var(--radius-sm)}
</style>
</head>
<body class="adm-body" data-adm="uyeler">

<div id="fitAdminTop"></div>

<main class="adm-main">
  <div class="adm-page">

    <div class="adm-head">
      <div class="h-txt">
        <h1>Üyeler ve Yetki</h1>
        <div class="ph-sub">Kim üye, kim antrenör, kim yönetici. Satırdaki ada bas — üyenin künyesi,
           aboneliği, kademesi ve işlem geçmişi kendi sayfasında açılır.</div>
      </div>
      <div class="h-acts">
        <a class="btn btn-ghost" href="admin-rozetler-v1.html"><i class="fa-solid fa-medal"></i> Kademe merdiveni</a>
      </div>
    </div>

    <div id="uyKaynak"></div>

    <!-- ============ LİSTE (K-LİSTE) ============
         🔴 "Yeni üye" düğmesi BİLEREK YOK. Üye kendi kaydolur; panelden
         hesap açmak, sahibi olmadığın bir e-postayla kimlik yaratmaktır.
         Gastro'da bu düğme var ama orada `@can('assign-roles')` ile
         koşullu ve gerekçesi ekip hesabı; Fit'te ekip hesabı rol
         değişikliğiyle kurulur, yeni kayıtla değil. -->
    <div class="adm-card" id="uyListe">
      <div class="filter-bar">
        <div class="fb-search">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <label class="sr-only" for="uyAra">Üye ara</label>
          <input type="search" id="uyAra" placeholder="Ad, e-posta ya da kullanıcı adı ara" />
        </div>
        <div class="fb-sel">
          <div class="ff" id="uySuzgec" data-ff></div>
        </div>
      </div>

      <div class="c-body flush">
        <div class="adm-tw">
          <table class="adm-table" id="uyTablo">
            <thead>
              <tr>
                <th>Üye</th><th>Rol</th><th>Durum</th><th>Kademe</th>
                <th class="num">Puan</th><th class="act">İşlem</th>
              </tr>
            </thead>
            <tbody id="uyGovde"></tbody>
          </table>
        </div>
      </div>

      <div class="adm-pager">
        <div class="p-info"><b id="uySay">0</b> üye · tümü tek sayfada</div>
        <div class="p-btns">
          <button class="adm-pg" type="button" disabled aria-label="Önceki sayfa"><i class="fa-solid fa-chevron-left"></i></button>
          <button class="adm-pg is-on" type="button" aria-current="page">1</button>
          <button class="adm-pg" type="button" disabled aria-label="Sonraki sayfa"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>
    </div>

  </div>
</main>

<script src="assets/js/fit-shell.js" data-adm-yalniz-filtre="1"></script>
<script src="assets/js/fit-rozet.js"></script>
<script src="assets/js/fit-admin-uye-veri.js"></script>
<script src="assets/js/fit-admin.js"></script>
<script>
/* =====================================================================
   ADMIN · ÜYELER VE YETKİ   (R19)   — K-LİSTE
   ---------------------------------------------------------------------
   🔴 R19'DA DEĞİŞEN: gömülü `#uyDetay` kartı SÖKÜLDÜ. İki alanlık
   (Rol, Hesap durumu) o kart D/8'in ölçtüğü eksiğin ta kendisiydi;
   üyenin künyesi, aboneliği, içeriği, rozeti ve destek geçmişi artık
   kendi sayfasında: `admin-uye-detay-v1.html?uye=<üye no>`.
   Liste ekranı yalnız LİSTE olur; detay ekranı yalnız DETAY.

   VERİ TEK KAYNAKTAN: `assets/js/fit-admin-uye-veri.js`. Detay ekranı da
   aynı dosyayı okur — kayıt iki yerde yaşamaz.

   NE GERÇEK, NE ÖRNEK
   · Kademe merdiveni GERÇEK: `FIT_ROZET.KADEMELER`, her kademede
     `minPuan` VE `minGun` eşiği. Ekran ikinci bir kopya tutmuyor.
   · Üye satırları ÖRNEK: bu prototipte sunucu ve üye veritabanı yok.
   · Üyenin kademesi UYDURULMUYOR, TÜRETİLİYOR (motorun kuralı).

   🔴 "KAYIT" KOLONU KALDIRILDI. Kolon örnek tarihler basıyordu, oysa
   `dm_user` şemasında üyelik tarihi alanı YOK (ölçüldü). Bir kolonu
   uydurulmuş tarihle doldurmak yerine kolon söküldü; alanın yokluğu
   detay ekranında, ait olduğu yerde ve gerekçesiyle yazılı.
   ===================================================================== */
(function () {
  'use strict';
  var A = window.FIT_ADMIN, U = window.FIT_ADMIN_UYE, R = window.FIT_ROZET;
  if (!A) return;
  var esc = A.esc, n = A.n;

  var govde = document.getElementById('uyGovde');

  document.getElementById('uyKaynak').innerHTML = A.kaynak('ornek',
    '<b>Üye satırları örnektir.</b> Bu prototipte sunucu ve üye veritabanı yok; kayıtlar ' +
    '<code>fit-admin-uye-veri.js</code>ten okunuyor ve üye detayı da aynı dosyayı okur. ' +
    '<b>Kademe verisi gerçektir:</b> kademeler ve eşikleri <code>fit-rozet.js</code>’ten ' +
    'geliyor, üyenin kademesi puan ve aktif gün sayısından motorun kuralıyla türetiliyor. ' +
    '<b>Üyelik tarihi kolonu yok:</b> <code>dm_user</code> şemasında kayıt tarihi alanı ' +
    'tanımlı değil (ölçüldü), uydurulmuş tarihle kolon doldurulmadı. ' +
    '<b>Yazma yüzeyi maket:</b> rol ve durum değişikliği detay ekranında doğrulanır, kayıt gitmez.');

  if (!U) {
    govde.innerHTML = '<tr><td colspan="6">' +
      A.bos('fa-user-slash', 'Üye verisi yüklenmedi',
            'Kayıtlar assets/js/fit-admin-uye-veri.js dosyasından okunur; bu sayfada yüklenemedi.') +
      '</td></tr>';
    return;
  }
  if (!R) {
    govde.innerHTML = '<tr><td colspan="6">' +
      A.bos('fa-medal', 'Kademe motoru yüklenmedi',
            'Kademe merdiveni fit-rozet.js dosyasından okunur; bu sayfada yüklenemedi. ' +
            'Kademe uydurulmadı — motor konuşmadan kademe yazılmaz.') + '</td></tr>';
    return;
  }

  var ROL = U.ROL, DURUM = U.DURUM, UYELER = U.UYELER;

  /* ---------- süzgeç: kabuğun ortak bileşeni ---------- */
  var sec = { rol:new Set(), durum:new Set(), kademe:new Set() };

  function suzgecKur(){
    var kok = document.getElementById('uySuzgec');
    var kademeler = [];
    UYELER.forEach(function (u) {
      var k = U.kademeBul(u.puan, u.gun);
      if (k && kademeler.indexOf(k.key) < 0) kademeler.push(k.key);
    });
    function grup(ad, etiket, liste){
      return '<div class="fgroup" data-group="' + ad + '" role="group" aria-label="' + etiket + '">' +
        '<span class="lbl">' + etiket + '</span>' +
        '<button class="df-fchip on" type="button" data-val="all">Tümü</button>' +
        liste.map(function (x) {
          return '<button class="df-fchip" type="button" data-val="' + esc(x[0]) + '">' +
                 (x[2] ? '<i class="fa-solid ' + x[2] + '"></i> ' : '') + esc(x[1]) + '</button>';
        }).join('') + '</div>';
    }
    kok.innerHTML =
      grup('rol', 'Rol', Object.keys(ROL).map(function (r) { return [r, ROL[r].ad, ROL[r].ico]; })) +
      grup('durum', 'Durum', Object.keys(DURUM).map(function (d) { return [d, DURUM[d].ad, DURUM[d].ico]; })) +
      grup('kademe', 'Kademe', kademeler.map(function (k) {
        var kk = R.KADEMELER.filter(function (x) { return x.key === k; })[0];
        return [k, kk.ad, kk.ico.replace('fa-solid ', '')];
      }));
    if (window.FIT_SHELL && FIT_SHELL.filtreKur) FIT_SHELL.filtreKur(kok);

    kok.querySelectorAll('.fgroup[data-group]').forEach(function (g) {
      var ad = g.getAttribute('data-group');
      g.querySelectorAll('.df-fchip').forEach(function (b) {
        b.addEventListener('click', function () {
          var v = b.getAttribute('data-val');
          if (v === 'all') {
            sec[ad].clear();
            g.querySelectorAll('.df-fchip').forEach(function (x) { x.classList.toggle('on', x === b); });
          } else {
            var ac = !sec[ad].has(v);
            if (ac) sec[ad].add(v); else sec[ad].delete(v);
            b.classList.toggle('on', ac);
            var all = g.querySelector('.df-fchip[data-val="all"]');
            if (all) all.classList.toggle('on', sec[ad].size === 0);
          }
          suz();
        });
      });
    });
  }

  /* Süzgeç sonucu 0 ise BOŞ DURUM basılır — dört parçası da yazılı.
     "0 üye" yazıp tabloyu boş bırakmak kusurdur (kit §9). */
  var bosSatir = null;
  function suz(){
    var say = 0;
    govde.querySelectorAll('tr[data-id]').forEach(function (tr) {
      var ok = (!sec.rol.size    || sec.rol.has(tr.getAttribute('data-rol'))) &&
               (!sec.durum.size  || sec.durum.has(tr.getAttribute('data-durum'))) &&
               (!sec.kademe.size || sec.kademe.has(tr.getAttribute('data-kademe')));
      tr.hidden = !ok; if (ok) say++;
    });
    if (say === 0) {
      if (!bosSatir) {
        bosSatir = document.createElement('tr');
        bosSatir.innerHTML = '<td colspan="6">' +
          A.bos('fa-filter-circle-xmark', 'Bu süzgeçle üye kalmadı',
                'Seçili rol, durum ve kademe birleşimine uyan kayıt yok. Bir çipi kapat ya da süzgeci sıfırla.',
                '<button class="btn btn-primary" type="button" data-suzgec-sifirla><i class="fa-solid fa-rotate-left"></i> Süzgeci sıfırla</button>') + '</td>';
        govde.appendChild(bosSatir);
      }
      bosSatir.hidden = false;
    } else if (bosSatir) bosSatir.hidden = true;
    document.getElementById('uySay').textContent = say;
  }

  /* ---------- liste ---------- */
  function bas(){
    govde.innerHTML = UYELER.map(function (u) {
      var k = U.kademeBul(u.puan, u.gun);
      var d = DURUM[u.durum], r = ROL[u.rol];
      var hedef = 'admin-uye-detay-v1.html?uye=' + encodeURIComponent(u.id);
      return '<tr data-id="' + esc(u.id) + '" data-rol="' + esc(u.rol) + '" data-durum="' + esc(u.durum) +
             '" data-kademe="' + esc(k ? k.key : '') + '" data-href="' + esc(hedef) + '">' +
        '<td><a class="uy-ad u-cell" href="' + esc(hedef) + '">' +
          '<span class="u-ava initials" aria-hidden="true">' + esc(U.basHarf(u.ad)) + '</span>' +
          '<span class="u-info"><b class="u-name">' + esc(u.ad) + '</b><small class="u-email">' + esc(u.mail) + '</small></span>' +
        '</a></td>' +
        '<td><span class="role-pill ' + esc(u.rol) + '"><i class="fa-solid ' + r.ico + '" aria-hidden="true"></i> ' + esc(r.ad) + '</span></td>' +
        '<td>' + A.rozet(d.rz, d.ad, d.ico) + '</td>' +
        '<td>' + (k ? '<i class="' + k.ico + '" aria-hidden="true"></i> ' + esc(k.ad) : '—') + '</td>' +
        '<td class="num">' + n(u.puan) + '</td>' +
        '<td class="act">' +
          '<a class="adm-ico-btn" href="' + esc(hedef) + '" aria-label="' + esc(u.ad) + ' detayını aç">' +
          '<i class="fa-solid fa-chevron-right"></i></a>' +
        '</td></tr>';
    }).join('');
    document.getElementById('uySay').textContent = UYELER.length;
    A.aramaKur(document.getElementById('uyAra'), document.getElementById('uyTablo'), document.getElementById('uySay'));
  }

  /* Satırın herhangi bir yerine basmak da detayı açar — ama satırın kendi
     bağlantı ve düğmeleri hariç, yoksa aynı tıklama iki kez yürürdü. */
  document.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    var sf = e.target.closest('[data-suzgec-sifirla]');
    if (sf) {
      sec.rol.clear(); sec.durum.clear(); sec.kademe.clear();
      document.querySelectorAll('#uySuzgec .fgroup').forEach(function (g) {
        g.querySelectorAll('.df-fchip').forEach(function (x) {
          x.classList.toggle('on', x.getAttribute('data-val') === 'all');
        });
      });
      suz();
      return;
    }
    var tr = e.target.closest('#uyGovde tr[data-href]');
    if (tr && !e.target.closest('a,button,input')) location.href = tr.getAttribute('data-href');
  });

  suzgecKur();
  bas();
})();
</script>
</body>
</html>
