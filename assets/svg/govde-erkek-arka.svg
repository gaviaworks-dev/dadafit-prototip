<!--
  DADAFIT — ERKEK GÖVDE · ARKA GÖRÜNÜM KAS HARİTASI          (H2 · 6. oturum)
  ==========================================================================
  DadaFit'in KENDİ çizimidir. Şablon olarak okunan plate'ler:
  Delavier "Krachttraining" PDF s. 4 (tam arka plate) · s. 31 ve 46 (omuz
  arka, trapez superior/medialis/inferior ayrımı) · s. 63 (kürek kemiği
  fiksatörleri) · s. 65 (sırt derin plate) · s. 79 (rotator manşet ve
  erector spinae derin katmanı) · s. 86 ve 106 (kalça/bacak arka).

  Siluet geometrisi ön dosyayla BİREBİR aynı (aynı kişinin iki görünümü):
  omuz dış 80↔320 · bel 148↔252 · kalça 130↔270 · gövde 320 px · bacak 404 px.
  Fark yalnız baş (yüz yok, ense var) ve bölge katmanı.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 900"
     role="img" aria-labelledby="baslikErkekArka" class="an-harita" data-gorunum="arka" data-cinsiyet="erkek"
     preserveAspectRatio="xMidYMid meet">
  <title id="baslikErkekArka">Erkek gövde, arka görünüm — tıklanabilir kas haritası</title>

  <!-- KIRPMA KATMANI — kas bölgeleri siluetin DIŞINA taşamaz.
       Bölge path'leri elle çizildiği için kenarlarda birkaç piksellik
       taşma kaçınılmazdı; tek tek ovmak yerine bölge katmanı siluetin
       birleşimine kırpılıyor. clipPath çocukları birleşim (union) olarak
       davranır, <use> ile siluet şekillerinin ta kendisi kullanılıyor —
       yani siluet değişirse kırpma da kendiliğinden değişir. -->
  <defs>
    <clipPath id="clipErkekArka">
      <use href="#sErkekArka1"/>
      <use href="#sErkekArka2"/>
      <use href="#sErkekArka3"/>
      <use href="#sErkekArka4"/>
      <use href="#sErkekArka5"/>
      <use href="#sErkekArka6"/>
      <use href="#sErkekArka7"/>
      <use href="#sErkekArka8"/>
      <use href="#sErkekArka9"/>
    </clipPath>
  </defs>

