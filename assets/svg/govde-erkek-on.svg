<!--
  DADAFIT — ERKEK GÖVDE · ÖN GÖRÜNÜM KAS HARİTASI            (H2 · 6. oturum)
  ==========================================================================
  DadaFit'in KENDİ çizimidir. Hazır anatomi görseli, stok illüstrasyon ya da
  MuscleWiki varlığı kullanılmadı. Bölge sınırları, kas grubu ayrımı ve
  yüzeysel katman düzeni Delavier "Krachttraining" plate'lerinden ŞABLON
  olarak okundu (PDF s. 5 tam ön plate · s. 31 omuz · s. 63 göğüs/serratus ·
  s. 86 bacak · s. 117 ve 120 karın) — çizimin kendisi kopyalanmadı.

  KOORDİNAT SİSTEMİ — dört dosyada aynı: viewBox 0 0 400 900, orta hat x=200.
  width/height SABİTLENMEZ; ölçek sayfadaki kaptan gelir.

  ERKEK SİLUET ÖLÇÜLERİ (kadın dosyasıyla karşılaştır):
    omuz dış kenarı   x  80 ↔ 320   (deltoid dahil genişlik 240)
    gövde omuz köşesi x 106 ↔ 294
    bel  (y=356)      x 148 ↔ 252   (genişlik 104)
    kalça(y=468)      x 130 ↔ 270   (genişlik 140)
    omuz : kalça      ≈ 1,71  → ters üçgen (V) gövde
    gövde boyu 148→468 = 320 px · bacak boyu 468→872 = 404 px

  RENK SABİTLENMEZ: bölgeler fill="currentColor" taşır, opaklık sınıftan
  gelir. Seçili ve hover renkleri sayfa CSS token’larından sürülür.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 900"
     role="img" aria-labelledby="baslikErkekOn" class="an-harita" data-gorunum="on" data-cinsiyet="erkek"
     preserveAspectRatio="xMidYMid meet">
