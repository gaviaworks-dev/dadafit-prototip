  <!-- KIRPMA KATMANI — kas bölgeleri siluetin DIŞINA taşamaz.
       Bölge path'leri elle çizildiği için kenarlarda birkaç piksellik
       taşma kaçınılmazdı; tek tek ovmak yerine bölge katmanı siluetin
       birleşimine kırpılıyor. clipPath çocukları birleşim (union) olarak
       davranır, <use> ile siluet şekillerinin ta kendisi kullanılıyor —
       yani siluet değişirse kırpma da kendiliğinden değişir. -->
  <defs>
    <clipPath id="clipErkekOn">
      <use href="#sErkekOn1"/>
      <use href="#sErkekOn2"/>
      <use href="#sErkekOn3"/>
      <use href="#sErkekOn4"/>
