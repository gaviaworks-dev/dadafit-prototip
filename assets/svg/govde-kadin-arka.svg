  DADAFIT — KADIN GÖVDE · ARKA GÖRÜNÜM KAS HARİTASI          (H2 · 6. oturum)
  ==========================================================================
  DadaFit'in KENDİ çizimidir. Şablon plate'ler: Delavier "Krachttraining"
  PDF s. 79 (deadlift — kadın figür, yüzeysel + derin arka katman: rotator
  manşet ve erector spinae bu sayfadan okundu) · s. 4 ve 65 (sırt sınırları)
  · s. 106 ve 126 (kalça arka). Kitabın çizimleri kopyalanmadı.

  Siluet, kadın ön dosyasıyla BİREBİR aynı geometriyi kullanır (aynı kişinin
  iki görünümü) ve erkek dosyalarından ölçüyle ayrılır:
    omuz dış 94↔306 (erkek 80↔320) · bel y=342 · 154↔246 (erkek y=356 · 148↔252)
    kalça y=452 · 124↔276 (erkek y=468 · 130↔270) · omuz:kalça 1,39 (erkek 1,71)
    gövde 306 px (erkek 320) · bacak 424 px (erkek 404)
-->
