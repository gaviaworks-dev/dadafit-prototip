<!--
  DADAFIT — KADIN GÖVDE · ÖN GÖRÜNÜM KAS HARİTASI            (H2 · 6. oturum)
  ==========================================================================
  DadaFit'in KENDİ çizimidir. Kadın figür oranları için okunan plate'ler:
  Delavier "Krachttraining" PDF s. 79 (deadlift — kadın figür, yüzeysel ve
  derin arka) · s. 120 (crunches — kadın figür, ön gövde) · s. 5 ve 86
  (kas sınırları). Kitabın çizimleri kopyalanmadı.

  ERKEK DOSYASINDAN GERÇEKTEN FARKLI SİLUET — ölçülerle:
                          KADIN            ERKEK
    omuz dış kenarı       x  94 ↔ 306      x  80 ↔ 320
    gövde omuz köşesi     x 118 ↔ 282      x 106 ↔ 294
    bel                   y=342 · 154↔246  y=356 · 148↔252
    kalça                 y=452 · 124↔276  y=468 · 130↔270
    omuz : kalça          212:152 ≈ 1,39   240:140 ≈ 1,71
    gövde boyu            146→452 = 306    148→468 = 320
    bacak boyu            452→876 = 424    468→872 = 404
    baş                   rx 32 · ry 41    rx 35 · ry 44
  Yani: dar omuz · yüksek ve dar bel · geniş kalça · kısa gövde · uzun bacak.
  Bölge path'leri bu siluete göre YENİDEN çizildi, ölçeklenmiş kopya değil.
-->
